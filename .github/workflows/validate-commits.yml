name: Validate Jira Story in Commit

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-commit:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install dependencies
      run: |
        npm init -y
        npm install axios
    
    - name: Validate Jira Story
      env:
        JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
        JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
        JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        PROJECT_KEY: "COFFE"
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        cat > validate-commit.js << 'EOF'
        const axios = require('axios');
        const { execSync } = require('child_process');

        const JIRA_BASE_URL = process.env.JIRA_BASE_URL;
        const JIRA_EMAIL = process.env.JIRA_EMAIL;
        const JIRA_API_TOKEN = process.env.JIRA_API_TOKEN;
        const PROJECT_KEY = process.env.PROJECT_KEY;
        const BRANCH_NAME = process.env.BRANCH_NAME;

        const jiraAuth = Buffer.from(`${JIRA_EMAIL}:${JIRA_API_TOKEN}`).toString('base64');

        async function validateJiraStory(issueKey) {
          try {
            console.log(`Validating story: ${issueKey}`);
            
            const response = await axios.get(
              `${JIRA_BASE_URL}/rest/api/3/issue/${issueKey}`,
              {
                headers: {
                  'Authorization': `Basic ${jiraAuth}`,
                  'Accept': 'application/json'
                }
              }
            );

            const issue = response.data;
            
            const issueType = issue.fields.issuetype.name.toLowerCase();
            if (issueType !== 'story') {
              throw new Error(`The issue ${issueKey} is of type '${issue.fields.issuetype.name}', but must be a 'Story'`);
            }
            
            const status = issue.fields.status.name.toLowerCase();
            const validStatuses = ['en curso'];
            
            if (!validStatuses.some(validStatus => status.includes(validStatus.toLowerCase()))) {
              throw new Error(`The issue ${issueKey} is in status '${issue.fields.status.name}', but must be in ${validStatuses}`);
            }
            
            console.log(`Story ${issueKey} validated successfully:`);
            console.log(`   - Type: ${issue.fields.issuetype.name}`);
            console.log(`   - Status: ${issue.fields.status.name}`);
            console.log(`   - Summary: ${issue.fields.summary}`);
            
            return true;
            
          } catch (error) {
            if (error.response && error.response.status === 404) {
              throw new Error(`The story ${issueKey} does not exist in Jira`);
            }
            throw error;
          }
        }

        function extractJiraKeys(commitMessage) {
          const regex = new RegExp(`${PROJECT_KEY}-\\d+`, 'gi');
          const matches = commitMessage.match(regex);
          return matches ? [...new Set(matches.map(match => match.toUpperCase()))] : [];
        }

        async function validateCommits() {
          try {
            if (BRANCH_NAME === 'develop') {
              console.log("Commits are not allowed directly on the 'develop' branch.");
              process.exit(1);
            }

            let commits = [];
            
            if (process.env.GITHUB_EVENT_NAME === 'push') {
              const beforeSha = process.env.GITHUB_EVENT_BEFORE || 'HEAD~1';
              const afterSha = process.env.GITHUB_SHA;
              
              try {
                const commitRange = `${beforeSha}..${afterSha}`;
                const gitLog = execSync(`git log ${commitRange} --pretty=format:"%H|%s"`, { encoding: 'utf8' });
                
                if (gitLog.trim()) {
                  commits = gitLog.trim().split('\n').map(line => {
                    const [hash, message] = line.split('|');
                    return { hash, message };
                  });
                }
              } catch (error) {
                const gitLog = execSync('git log -1 --pretty=format:"%H|%s"', { encoding: 'utf8' });
                const [hash, message] = gitLog.split('|');
                commits = [{ hash, message }];
              }
            } else {
              const gitLog = execSync('git log origin/main..HEAD --pretty=format:"%H|%s"', { encoding: 'utf8' });
              commits = gitLog.trim().split('\n').map(line => {
                const [hash, message] = line.split('|');
                return { hash, message };
              });
            }

            console.log(`Validating ${commits.length} commit(s)...`);
            
            let hasValidationErrors = false;
            
            for (const commit of commits) {
              console.log(`\nAnalyzing commit: ${commit.hash.substring(0, 7)}`);
              console.log(`   Message: ${commit.message}`);
              
              const jiraKeys = extractJiraKeys(commit.message);
              
              if (jiraKeys.length === 0) {
                console.log(`The commit ${commit.hash.substring(0, 7)} does not contain any Jira story code ${PROJECT_KEY}-XXXX`);
                hasValidationErrors = true;
                continue;
              }
              
              console.log(`   Jira stories found: ${jiraKeys.join(', ')}`);
              
              for (const jiraKey of jiraKeys) {
                try {
                  await validateJiraStory(jiraKey);
                } catch (error) {
                  console.log(`Error in commit ${commit.hash.substring(0, 7)}: ${error.message}`);
                  hasValidationErrors = true;
                }
              }
            }
            
            if (hasValidationErrors) {
              console.log('\nValidation failed. Please fix the errors before continuing.');
              process.exit(1);
            } else {
              console.log('\nAll commits have been validated successfully.');
            }
            
          } catch (error) {
            console.error('Error during validation:', error.message);
            process.exit(1);
          }
        }

        validateCommits();
        EOF
        
        node validate-commit.js

    - name: Success message
      if: success()
      run: |
        echo "Validation completed successfully."
        echo "All commits comply with Jira rules."
